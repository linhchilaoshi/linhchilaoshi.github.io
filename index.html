<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linh Chi 老师 · Bài tập tiếng Trung</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3eefb;--card:#fff;--ink:#352c46;--soft:#7d7390;--line:#e5dcf2;--brand:#7c5cd6;--brand-l:#ece5fb;--pink:#e9668f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Be Vietnam Pro",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:32px 16px 48px}
header{text-align:center;margin-bottom:24px}
.zh{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}
h1{font-size:28px;font-weight:800}
h1 .zh{color:var(--pink)}
header p{color:var(--soft);margin-top:4px}
.list{display:grid;gap:12px}
a.card{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;text-decoration:none;color:inherit;transition:border-color .2s,transform .2s}
a.card:hover{border-color:var(--brand);transform:translateY(-2px)}
a.card:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.no{flex:none;width:48px;height:48px;border-radius:12px;background:var(--brand-l);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:18px}
.t .z{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:21px;font-weight:700}
.t .v{color:var(--soft);font-size:14px}
.go{margin-left:auto;color:var(--brand);font-weight:800;font-size:20px}
footer{text-align:center;color:var(--soft);font-size:13px;margin-top:28px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Linh Chi <span class="zh">老师</span></h1>
    <p>Bài tập tiếng Trung · chọn bài để ôn tập và làm bài</p>
  </header>
  <div class="list">
    <a class="card" href="bai1/"><span class="no">1</span><span class="t"><span class="z">我们来中国学习了</span><br><span class="v">Bài 1 · Chúng tôi đã đến Trung Quốc học tập</span></span><span class="go">→</span></a>
    <a class="card" href="bai2/"><span class="no">2</span><span class="t"><span class="z">租到了合适的房子</span><br><span class="v">Bài 2 · Đã thuê được căn nhà phù hợp</span></span><span class="go">→</span></a>
    <a class="card" href="bai9/"><span class="no">9</span><span class="t"><span class="z">我明天上午在学校学习</span><br><span class="v">Bài 9 · Ôn tập &amp; kiểm tra từ vựng</span></span><span class="go">→</span></a>
  </div>
  <footer>Nhập đúng họ tên và lớp trước khi làm bài nhé. 加油！</footer>
</div>
</body>
</html>
